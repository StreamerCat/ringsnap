name: Quality Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Typecheck / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Security regression tests
        run: npm run test:security

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build:no-prerender
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_ENV_TIER: staging
          VITE_SENTRY_DSN: ''

  python-ops:
    name: Python ops regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ringsnap_ops_flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install patched package manager
        run: python -m pip install uv==0.13.5
      - name: Install frozen dependencies
        run: uv sync --frozen --no-install-project
      - name: Test ops workflows without production credentials
        run: .venv/bin/python -m pytest tests -q
        env:
          PYTHONPATH: src
